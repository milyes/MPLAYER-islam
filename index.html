<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI22 Quran Player</title>

<style>
:root{
 --bg:#07120d;
 --card:#0d1f17;
 --border:#1d4d39;
 --accent:#10b981;
 --text:#f8fafc;
 --muted:#94a3b8;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,sans-serif;
 min-height:100vh;
 padding:20px;
}

.container{
 max-width:1200px;
 margin:auto;
 display:grid;
 gap:16px;
}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:16px;
 padding:16px;
}

header{
 display:flex;
 flex-wrap:wrap;
 gap:12px;
 justify-content:space-between;
 align-items:center;
}

h1{
 color:var(--accent);
}

select,input,button{
 border:none;
 outline:none;
 border-radius:10px;
 padding:10px;
}

input,select{
 background:#0b1410;
 color:white;
 border:1px solid var(--border);
}

button{
 cursor:pointer;
 background:var(--accent);
 color:black;
 font-weight:700;
}

button:hover{
 filter:brightness(1.1);
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
 gap:12px;
}

.surah{
 cursor:pointer;
 transition:.2s;
}

.surah:hover{
 transform:translateY(-2px);
 border-color:var(--accent);
}

.playing{
 border:2px solid var(--accent);
 box-shadow:0 0 20px rgba(16,185,129,.4);
}

.badge{
 background:var(--accent);
 color:black;
 border-radius:999px;
 padding:4px 10px;
 font-size:12px;
 font-weight:bold;
 display:inline-block;
}

.row{
 display:flex;
 gap:10px;
 align-items:center;
 flex-wrap:wrap;
}

.progress{
 width:100%;
}

.queue-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:8px;
 margin:4px 0;
 background:#08100c;
 border-radius:8px;
}

.ayah{
 padding:10px;
 margin:6px 0;
 border-bottom:1px solid rgba(255,255,255,.08);
}

.bookmark{
 float:right;
 cursor:pointer;
}

.hidden{
 display:none;
}

#featuredArabic{
 font-size:32px;
 margin-top:8px;
 color:var(--accent);
}

footer{
 position:sticky;
 bottom:0;
 background:#08130f;
 border:1px solid var(--border);
 border-radius:16px;
 padding:12px;
}
</style>
</head>

<body>

<div class="container">

<header class="card">
<div>
<h1>AI22 Quran Player</h1>
<div id="nowPlaying"></div>
</div>

<div class="row">
<input id="search" placeholder="Search">

<select id="lang">
<option value="en">English</option>
<option value="fr">Français</option>
<option value="ar">العربية</option>
</select>

<button id="voiceBtn">🎤</button>
</div>
</header>

<section class="card">
<h2 id="featuredTitle">Featured Surah</h2>
<div id="featuredNumber"></div>
<div id="featuredEnglish"></div>
<div id="featuredArabic"></div>
<div id="featuredPosition"></div>
</section>

<section class="card">
<div class="row">
<button id="queueToggle">Queue</button>
<button id="bookmarkToggle">Bookmarks</button>
<button id="trainingToggle">Training</button>
<label>
CC
<input type="checkbox" id="ccToggle">
</label>
</div>
</section>

<section id="queuePanel" class="card hidden">
<h2>Queue</h2>
<div id="queue"></div>
<button id="clearQueue">Clear</button>
</section>

<section id="bookmarkPanel" class="card hidden">
<h2>Bookmarks</h2>
<div id="bookmarks"></div>
</section>

<section id="trainingPanel" class="card hidden">
<h2>Voice Training</h2>
<button id="recordBtn">Start Recording</button>
<audio id="recordedAudio" controls></audio>
</section>

<section id="captionsPanel" class="card hidden">
<h2>Verses</h2>
<div id="captions"></div>
</section>

<section id="surahs" class="grid"></section>

<footer>
<div class="row">
<button id="restartBtn">↺</button>
<button id="playBtn">▶</button>

<input
id="progress"
class="progress"
type="range"
value="0"
min="0"
max="100">

<label>
0.5x
<input
id="speed"
type="range"
min="0.5"
max="2"
step="0.05"
value="1">
2x
</label>

<span id="speedValue">1.00x</span>
</div>

<audio id="audio"></audio>
</footer>

</div>

<script>
(() => {

const T = {
en:{
search:"Search Surahs",
queue:"Queue",
bookmarks:"Bookmarks",
featured:"Featured Surah",
training:"Voice Training"
},
fr:{
search:"Rechercher une sourate",
queue:"File d'attente",
bookmarks:"Signets",
featured:"Sourate sélectionnée",
training:"Formation vocale"
},
ar:{
search:"البحث عن سورة",
queue:"قائمة التشغيل",
bookmarks:"العلامات المرجعية",
featured:"السورة المحددة",
training:"التدريب الصوتي"
}
};

const SURAHS = [
{
id:1,
en:"Al-Fatihah",
ar:"الفاتحة"
},
{
id:2,
en:"Al-Baqarah",
ar:"البقرة"
},
{
id:3,
en:"Ali 'Imran",
ar:"آل عمران"
},
{
id:4,
en:"An-Nisa",
ar:"النساء"
},
{
id:5,
en:"Al-Ma'idah",
ar:"المائدة"
}
];

let lang = localStorage.getItem("lang") || "en";
let current = null;
let queue = JSON.parse(localStorage.getItem("queue") || "[]");
let bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");

const audio = document.getElementById("audio");
const search = document.getElementById("search");
const list = document.getElementById("surahs");
const langSel = document.getElementById("lang");
const speed = document.getElementById("speed");

langSel.value = lang;

function applyLanguage(){
document.documentElement.dir =
lang === "ar" ? "rtl" : "ltr";

search.placeholder = T[lang].search;
document.getElementById("featuredTitle").textContent = T[lang].featured;
}

function renderSurahs(){

const q = search.value.toLowerCase();

list.innerHTML = "";

SURAHS
.filter(s =>
s.en.toLowerCase().includes(q) ||
s.ar.includes(q))
.forEach(s => {

const div = document.createElement("div");

div.className =
"card surah" +
(current && current.id===s.id ? " playing":"");

div.innerHTML = `
<div class="badge">#${s.id}</div>
<h3>${s.en}</h3>
<div>${s.ar}</div>
<br>
<button data-queue="${s.id}">+</button>
`;

div.onclick = () => selectSurah(s);

div.querySelector("button")
.onclick = e => {
e.stopPropagation();
queue.push(s);
saveQueue();
renderQueue();
};

list.appendChild(div);
});
}

function selectSurah(s){

current = s;

document.getElementById(
"featuredNumber"
).textContent = "Surah #" + s.id;

document.getElementById(
"featuredEnglish"
).textContent = s.en;

document.getElementById(
"featuredArabic"
).textContent = s.ar;

document.getElementById(
"featuredPosition"
).textContent =
"Position: " + s.id + "/114";

document.getElementById(
"nowPlaying"
).textContent =
"Now Playing: " + s.en;

renderSurahs();

audio.src =
"https://download.quranicaudio.com/qdc/saud_al_shuraym/murattal/" +
String(s.id).padStart(3,"0") +
".mp3";

audio.play().catch(()=>{});
}

function renderQueue(){

const q = document.getElementById("queue");

q.innerHTML = "";

queue.forEach((s,i)=>{

const row = document.createElement("div");
row.className = "queue-item";

row.innerHTML =
`
<span>${s.en}</span>
<div>
<button data-up="${i}">↑</button>
<button data-down="${i}">↓</button>
<button data-remove="${i}">✕</button>
</div>
`;

q.appendChild(row);
});

q.querySelectorAll("[data-remove]")
.forEach(btn=>{
btn.onclick=()=>{
queue.splice(btn.dataset.remove,1);
saveQueue();
renderQueue();
};
});

q.querySelectorAll("[data-up]")
.forEach(btn=>{
btn.onclick=()=>{
const i=+btn.dataset.up;
if(i>0){
[queue[i],queue[i-1]]=[queue[i-1],queue[i]];
saveQueue();
renderQueue();
}
};
});

q.querySelectorAll("[data-down]")
.forEach(btn=>{
btn.onclick=()=>{
const i=+btn.dataset.down;
if(i<queue.length-1){
[queue[i],queue[i+1]]=[queue[i+1],queue[i]];
saveQueue();
renderQueue();
}
};
});
}

function saveQueue(){
localStorage.setItem(
"queue",
JSON.stringify(queue)
);
}

function renderBookmarks(){

const root =
document.getElementById("bookmarks");

root.innerHTML = "";

bookmarks.forEach((b,i)=>{

const el=document.createElement("div");
el.className="queue-item";

el.innerHTML=
`
<span>${b}</span>
<button data-del="${i}">✕</button>
`;

root.appendChild(el);
});

root.querySelectorAll("[data-del]")
.forEach(btn=>{
btn.onclick=()=>{
bookmarks.splice(btn.dataset.del,1);
localStorage.setItem(
"bookmarks",
JSON.stringify(bookmarks)
);
renderBookmarks();
};
});
}

audio.addEventListener("timeupdate",()=>{

if(audio.duration){

progress.value =
(audio.currentTime/audio.duration)*100;
}
});

progress.addEventListener("input",()=>{

if(audio.duration){

audio.currentTime =
(progress.value/100) *
audio.duration;
}
});

speed.addEventListener("input",()=>{

audio.playbackRate =
Number(speed.value);

document.getElementById(
"speedValue"
).textContent =
Number(speed.value).toFixed(2) + "x";
});

document.getElementById(
"restartBtn"
).onclick = ()=>{

audio.currentTime = 0;
};

document.getElementById(
"playBtn"
).onclick = ()=>{

if(audio.paused)
audio.play();
else
audio.pause();
};

audio.addEventListener("ended",()=>{

if(queue.length){

const next = queue.shift();

saveQueue();
renderQueue();

selectSurah(next);
}
});

document.getElementById(
"queueToggle"
).onclick = ()=>{

document.getElementById(
"queuePanel"
).classList.toggle("hidden");
};

document.getElementById(
"bookmarkToggle"
).onclick = ()=>{

document.getElementById(
"bookmarkPanel"
).classList.toggle("hidden");
};

document.getElementById(
"trainingToggle"
).onclick = ()=>{

document.getElementById(
"trainingPanel"
).classList.toggle("hidden");
};

document.getElementById(
"ccToggle"
).onchange = e=>{

document.getElementById(
"captionsPanel"
).classList.toggle(
"hidden",
!e.target.checked
);

if(e.target.checked){

document.getElementById(
"captions"
).innerHTML=

'<div class="ayah">1 ⭐ <span class="bookmark">🔖</span></div>'+
'<div class="ayah">2 ⭐ <span class="bookmark">🔖</span></div>'+
'<div class="ayah">3 ⭐ <span class="bookmark">🔖</span></div>';

document
.querySelectorAll(".bookmark")
.forEach((b,i)=>{

b.onclick=()=>{

bookmarks.push(
(current ? current.en : "Surah")
+
" - Ayah "
+
(i+1)
);

localStorage.setItem(
"bookmarks",
JSON.stringify(bookmarks)
);

renderBookmarks();
};
});
}
};

langSel.addEventListener(
"change",
e=>{
lang=e.target.value;
localStorage.setItem("lang",lang);
applyLanguage();
}
);

search.addEventListener(
"input",
renderSurahs
);

document.getElementById(
"clearQueue"
).onclick=()=>{

queue=[];
saveQueue();
renderQueue();
};

applyLanguage();
renderSurahs();
renderQueue();
renderBookmarks();

})();
</script>

</body>
</html>
